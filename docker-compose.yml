services:
  postgres:
    image: postgres:16
    container_name: eko-letterbox-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: eko
      POSTGRES_PASSWORD: eko
      POSTGRES_DB: eko_letterbox
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
