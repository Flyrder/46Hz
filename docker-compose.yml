services:
  postgres:
    # postgres:16 is a multi-platform official image supporting both linux/amd64 and linux/arm64
    image: postgres:16
    container_name: 46hz-letterbox-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-46hz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-46hz}
      POSTGRES_DB: ${POSTGRES_DB:-46hz_letterbox}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
